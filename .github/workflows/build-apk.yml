name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para crear el Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Instala Gradle 8.9 (no hace falta el archivo gradlew en el repo)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK debug
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      # Si la compilacion falla, deja los errores de Kotlin como anotaciones visibles en la ejecucion
      - name: Mostrar errores de compilacion
        if: failure()
        run: |
          grep -E "^e: |error:" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GlassPlayer.apk

      # Muestra la huella de la firma: debe ser siempre la misma para poder actualizar la app
      - name: Huella de la firma del APK
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs GlassPlayer.apk | grep -i "SHA-256"

      # Tambien queda como artifact en la pestana Actions
      - uses: actions/upload-artifact@v4
        with:
          name: GlassPlayer-debug-apk
          path: GlassPlayer.apk
          if-no-files-found: error

      # Solo en main: publica un Release con el APK adjunto
      - name: Publicar Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GlassPlayer v1.0.${{ github.run_number }}
          body: |
            APK de depuracion generado automaticamente desde `main`.
            Commit: ${{ github.sha }}
          files: GlassPlayer.apk
          make_latest: true
