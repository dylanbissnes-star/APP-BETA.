name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para crear el Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Instala Gradle 8.9 (no hace falta el archivo gradlew en el repo)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK debug
        run: gradle assembleDebug --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GlassPlayer.apk

      # Muestra la huella de la firma: debe ser siempre la misma para poder actualizar la app
      - name: Huella de la firma del APK
        run: keytool -printcert -jarfile GlassPlayer.apk | grep -E "Owner|SHA256"

      # Tambien queda como artifact en la pestana Actions
      - uses: actions/upload-artifact@v4
        with:
          name: GlassPlayer-debug-apk
          path: GlassPlayer.apk
          if-no-files-found: error

      # Solo en main: publica un Release con el APK adjunto
      - name: Publicar Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GlassPlayer v1.0.${{ github.run_number }}
          body: |
            APK de depuracion generado automaticamente desde `main`.
            Commit: ${{ github.sha }}
          files: GlassPlayer.apk
          make_latest: true
